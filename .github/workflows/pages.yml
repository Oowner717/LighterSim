name: Deploy to GitHub Pages

# Deploys on every push to the branch the site publishes from, and can also be
# run by hand.
#
# It was manual-only, and the built-in pages-build-deployment quietly stopped
# firing on pushes after 17 Aug. Eleven commits went out believing they were
# live while the site served a build from before the backdrops were rebuilt --
# a push proves only that the branch moved, and nothing here was watching the
# difference. The push trigger is what closes that gap; the build stamp in the
# corner of the app is what makes it checkable at a glance.
on:
  push:
    branches: [claude/zippo-lighter-simulation-24ei5h]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js apple-touch-icon.png icon-192.png icon-512.png _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
