name: Deploy to GitHub Pages

# Manual-only: the live site publishes from the repo's default branch via the
# built-in Pages pipeline. This workflow needs the github-pages environment to
# allow this branch before it can deploy (Settings -> Environments).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site
        run: |
          mkdir _site
          cp index.html manifest.webmanifest apple-touch-icon.png icon-192.png icon-512.png _site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
