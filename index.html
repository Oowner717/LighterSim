<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ============================== TUNABLES ============================== */
const CFG = {
  // display
  MAX_DPR: 1.75,
  FOV: 34,
  FIT_HALF_H: 4.45,          // world half-height the camera must frame
  FIT_HALF_W: 3.4,
  CAM_TARGET_Y: 3.45,
  ZOOM_MIN: 0.62, ZOOM_MAX: 1.9,
  BLOOM_STRENGTH: 0.38, BLOOM_RADIUS: 0.55, BLOOM_THRESHOLD: 1.25, // HDR flame only, not chrome
  BLOOM_RES: 384,            // max dimension of bloom buffers (kept low-res)
  FPS_BLOOM_OFF: 45,         // sustained fps below this disables bloom

  // body dimensions (≈ millimetres / 10, real Zippo: 38 x 13 x 57mm).
  // The lid box overlaps the base by 0.12 so the mating roundings close
  // into a tight seam line; visible lid height stays 1.5.
  BODY_W: 3.8, BODY_D: 1.31, BASE_H: 4.2, LID_H: 1.62, LID_OVERLAP: 0.12, EDGE_R: 0.34,
  CHIM_X: -0.35, CHIM_W: 2.3, CHIM_D: 1.02, CHIM_H: 1.22,
  WHEEL_X: 1.30, WHEEL_Y: 4.68, WHEEL_R: 0.52, WHEEL_T: 0.40,

  // lid hinge (over-center cam). Flicks >~16 rad/s carry through the cam;
  // anything weaker falls back to the nearest end. Pop is the hardest snap.
  LID_OPEN: 1.75,            // rad (~100 deg), fully open sideways
  LID_CAM_K: 190,            // over-center torque strength
  LID_DAMP: 2.6,
  LID_BOUNCE: 0.14,          // restitution at the stops
  LID_BOUNCE_MIN: 8,         // |omega| below this at a stop -> rest dead
  LID_POP_VEL: 30,           // rad/s given by squeeze-pop (the hardest snap)
  LID_DBLTAP_VEL: 20,

  // squeeze-pop
  SQZ_TRAVEL: 0.13,          // fraction of initial pinch distance = full pressure
  SQZ_MIN_PX: 26,
  SQZ_MAX_SQUASH: 0.03,      // <=3% elastic squash
  SQZ_ZONE_FRAC: 0.16,       // zone radius as a fraction of vmin

  // flint wheel (spring-loaded against the flint: stops almost with the thumb)
  WHEEL_FRICTION: 15,
  WHEEL_GAIN: 0.055,         // rad/s per px/s of swipe
  SPARK_SPEED_VMIN: 1.7,     // swipe speed (vmin/s) needed to spark
  SPARK_REFRACTORY: 0.22,    // s between spark bursts
  IGNITE_DELAY: 0.07,        // s from spark burst to catching

  // wick
  WICK_SEGS: 4, WICK_SEG_LEN: 0.345, WICK_R: 0.12,
  WICK_JOINT_MAX: [0.32, 0.95, 1.0, 0.9],   // per-joint plastic bend limit (rad)

  // flame
  FLAME_H: 1.28,
  FLAME_BEND_K: 26, FLAME_BEND_C: 6.0,
  FLAME_LIGHT: 9.5,          // point light intensity while LIT
  EMBER_LIFE: 12,            // s of unattended pilot before it dies
  TURB_TIME: 0.9,            // s of hard flicker after a fast swipe

  // gestures (screen-space, generous ~48px colliders scaled by vmin)
  R_TIP: 34, R_WHEEL: 48, R_MOUTH: 48, R_LID_PAD: 58,
  TAP_MS: 280, TAP_PX: 16, DBL_MS: 340, DBL_PX: 80,
  CROSS_FAST_VMIN: 1.5,      // chimney crossings faster than this (vmin/s) = "fast"
  FLICK_VMIN: 2.4,           // release speed (vmin/s) that counts as a flick
  ORBIT_SPEED: 2.6,          // rad per vmin of drag

  // device motion
  JERK_ACC: 13,              // m/s^2 single spike -> relight / hard bend
  SHAKE_EMA: 7.5,            // sustained accel level -> snuff
  SHAKE_HOLD: 0.75,          // s the level must hold

  // physics
  H: 1 / 120,                // fixed timestep
};

/* ============================== UTILS ============================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const clamp01 = v => clamp(v, 0, 1);
const lerp = (a, b, t) => a + (b - a) * t;
const hashN = n => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };
// smooth value noise in [-1, 1]
function vnoise(t) {
  const i = Math.floor(t), f = t - i, u = f * f * (3 - 2 * f);
  return (lerp(hashN(i), hashN(i + 1), u)) * 2 - 1;
}
const vmin = () => Math.min(window.innerWidth, window.innerHeight);
const uiScale = () => Math.max(0.85, vmin() / 420);

const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();
const _v4 = new THREE.Vector3(), _v5 = new THREE.Vector3(), _v6 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
const _qI = new THREE.Quaternion();

/* ============================== RENDERER / SCENE ============================== */
const canvas = document.getElementById('c');
const hintEl = document.getElementById('hint');
const motionBtn = document.getElementById('motionBtn');

const renderer = new THREE.WebGLRenderer({
  canvas, antialias: true, powerPreference: 'high-performance',
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.MAX_DPR));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(CFG.FOV, 1, 0.1, 120);

{ // dark product-studio environment: off-axis softboxes so flat faces reflect
  // mostly darkness while rounded edges catch defined light strips. A bright
  // generic room blows the chrome to white at normal incidence.
  const env = new THREE.Scene();
  const shell = new THREE.Mesh(new THREE.BoxGeometry(60, 60, 60),
    new THREE.MeshBasicMaterial({ side: THREE.BackSide }));
  shell.material.color.setRGB(0.095, 0.1, 0.11);
  env.add(shell);
  const panels = [
    { w: 14, h: 10, pos: [-8, 9, 6], c: [2.2, 2.2, 2.25] },     // key softbox, up-left-front
    { w: 8, h: 6, pos: [9, 5, -7], c: [1.6, 1.75, 2.05] },      // cool rim, right-back
    { w: 12, h: 3, pos: [0, 13, 2], c: [2.0, 2.0, 2.05] },      // top strip (lid-top line)
    { w: 16, h: 1.1, pos: [0, 4.5, 11], c: [1.0, 1.0, 1.05] },  // thin frontal band for the brushed face
    { w: 10, h: 6, pos: [0, -8, 4], c: [0.7, 0.7, 0.75] },      // floor bounce
  ];
  for (const p of panels) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(p.w, p.h),
      new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }));
    m.material.color.setRGB(p.c[0], p.c[1], p.c[2]);
    m.position.set(p.pos[0], p.pos[1], p.pos[2]);
    m.lookAt(0, 3, 0);
    env.add(m);
  }
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(env, 0.09).texture;
  pmrem.dispose();
}
function radialCanvas(size, stops, inner = 0) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const g = cv.getContext('2d');
  const gr = g.createRadialGradient(size / 2, size / 2, size * inner, size / 2, size / 2, size / 2);
  for (const [o, c] of stops) gr.addColorStop(o, c);
  g.fillStyle = gr; g.fillRect(0, 0, size, size);
  return cv;
}
{
  const bg = new THREE.CanvasTexture(radialCanvas(512, [
    [0, '#222933'], [0.5, '#151a21'], [1, '#07090c'],
  ]));
  bg.colorSpace = THREE.SRGBColorSpace;
  scene.background = bg;
}

// Composer with cheap low-res bloom (auto-disabled if fps sags).
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(CFG.BLOOM_RES, CFG.BLOOM_RES),
  CFG.BLOOM_STRENGTH, CFG.BLOOM_RADIUS, CFG.BLOOM_THRESHOLD);
{ // force the bloom buffers to stay low-res no matter the canvas size
  const orig = bloomPass.setSize.bind(bloomPass);
  bloomPass.setSize = (w, h) => {
    const s = Math.min(1, CFG.BLOOM_RES / Math.max(1, Math.max(w, h)));
    orig(Math.max(8, Math.round(w * s)), Math.max(8, Math.round(h * s)));
  };
  bloomPass.setSize(CFG.BLOOM_RES, CFG.BLOOM_RES);
}
composer.addPass(bloomPass);
composer.addPass(new OutputPass());
let bloomOn = true;

/* ============================== MATERIALS ============================== */
function brushedRoughnessTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgb(110,110,110)'; g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 1500; i++) {
    const x = Math.random() * 256, l = 30 + Math.random() * 200;
    const v = 60 + Math.random() * 110 | 0;
    g.strokeStyle = `rgba(${v},${v},${v},0.16)`;
    g.beginPath(); g.moveTo(x, Math.random() * 256 - l / 2); g.lineTo(x, Math.random() * 256 + l / 2); g.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
function knurlTex() {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128;
  const g = cv.getContext('2d');
  g.fillStyle = 'rgb(128,128,128)'; g.fillRect(0, 0, 128, 128);
  g.lineWidth = 2.4;
  for (let d = -128; d < 256; d += 7) {
    g.strokeStyle = 'rgba(255,255,255,0.85)';
    g.beginPath(); g.moveTo(d, 0); g.lineTo(d + 128, 128); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.85)';
    g.beginPath(); g.moveTo(d + 3, 0); g.lineTo(d + 131, 128); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.6)';
    g.beginPath(); g.moveTo(d + 128, 0); g.lineTo(d, 128); g.stroke();
  }
  const t = new THREE.CanvasTexture(cv);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 1);
  return t;
}
const brushed = brushedRoughnessTex();
const matChrome = new THREE.MeshStandardMaterial({
  color: 0xd9dee3, metalness: 1.0, roughness: 0.55, roughnessMap: brushed, envMapIntensity: 1.0,
});
const matChromeDark = new THREE.MeshStandardMaterial({
  color: 0xaeb5bc, metalness: 1.0, roughness: 0.45, roughnessMap: brushed, envMapIntensity: 1.35,
});
const matSteel = new THREE.MeshStandardMaterial({
  color: 0xc8ccd2, metalness: 1.0, roughness: 0.62, bumpMap: knurlTex(), bumpScale: 0.6, envMapIntensity: 1.0,
});
const matInsert = new THREE.MeshStandardMaterial({ color: 0x757b82, metalness: 0.95, roughness: 0.5, envMapIntensity: 0.9 });
const matDark = new THREE.MeshStandardMaterial({ color: 0x101214, metalness: 0.2, roughness: 0.9 });
const matWick = new THREE.MeshStandardMaterial({ color: 0xece2cc, metalness: 0, roughness: 0.95 });
const matWickTip = new THREE.MeshStandardMaterial({ color: 0x272120, metalness: 0, roughness: 0.95 });

/* ============================== MODEL ============================== */
const lighter = new THREE.Group();      // world root: recoil hop lives here
const squash = new THREE.Group();       // squeeze scale, pivot at the base bottom
const caseG = new THREE.Group();        // static body parts
const lidG = new THREE.Group();         // pivots at the hinge
lighter.add(squash); squash.add(caseG); squash.add(lidG);
scene.add(lighter);

// Real Zippos hinge on the narrow SIDE next to the flint wheel; the lid swings
// sideways in the plane of the wide face.
const HINGE_Y = CFG.BASE_H - CFG.LID_OVERLAP, HINGE_X = CFG.BODY_W / 2 + 0.06;
const RIM_Y = CFG.BASE_H + CFG.CHIM_H;
lidG.position.set(HINGE_X, HINGE_Y, 0);

// rounded-rectangle plan profile (case footprint), extruded upward
function roundedPlanGeo(w, d, r, h) {
  const s = new THREE.Shape();
  const hw = w / 2, hd = d / 2;
  s.moveTo(-hw + r, -hd); s.lineTo(hw - r, -hd); s.quadraticCurveTo(hw, -hd, hw, -hd + r);
  s.lineTo(hw, hd - r); s.quadraticCurveTo(hw, hd, hw - r, hd);
  s.lineTo(-hw + r, hd); s.quadraticCurveTo(-hw, hd, -hw, hd - r);
  s.lineTo(-hw, -hd + r); s.quadraticCurveTo(-hw, -hd, -hw + r, -hd);
  const g = new THREE.ExtrudeGeometry(s, { depth: h, bevelEnabled: false, curveSegments: 12 });
  g.rotateX(-Math.PI / 2);
  return g;
}
{ // base body
  const geo = new RoundedBoxGeometry(CFG.BODY_W, CFG.BASE_H, CFG.BODY_D, 4, CFG.EDGE_R);
  const base = new THREE.Mesh(geo, matChrome);
  base.position.y = CFG.BASE_H / 2;
  caseG.add(base);
}
const lidMesh = new THREE.Mesh(
  new RoundedBoxGeometry(CFG.BODY_W, CFG.LID_H, CFG.BODY_D, 4, CFG.EDGE_R), matChrome);
lidMesh.position.set(-HINGE_X, CFG.LID_H / 2, 0);
lidG.add(lidMesh);
{ // dark underside = the open lid's cavity
  const inner = new THREE.Mesh(
    new THREE.BoxGeometry(CFG.BODY_W - 0.24, 0.05, CFG.BODY_D - 0.24), matDark);
  inner.position.set(-HINGE_X, -0.02, 0);
  lidG.add(inner);
}
{ // 5-knuckle hinge along the narrow side + cam tab on the lid
  const kg = new THREE.CylinderGeometry(0.12, 0.12, 0.2, 10);
  kg.rotateX(Math.PI / 2);                 // barrel axis along z
  for (const z of [-0.45, 0, 0.45]) {
    const k = new THREE.Mesh(kg, matChromeDark);
    k.position.set(HINGE_X, HINGE_Y, z); caseG.add(k);
  }
  for (const z of [-0.225, 0.225]) {
    const k = new THREE.Mesh(kg, matChromeDark);
    k.position.set(0, 0, z); lidG.add(k);
  }
  const camBar = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.4, 0.3), matInsert);
  camBar.position.set(-0.32, -0.04, 0);
  lidG.add(camBar);
}
{ // insert shoulder fills the case mouth + dark inner floor
  const plate = new THREE.Mesh(
    roundedPlanGeo(CFG.BODY_W - 0.16, CFG.BODY_D - 0.16, CFG.EDGE_R - 0.07, 0.1), matInsert);
  plate.position.set(0, CFG.BASE_H - 0.08, 0);
  caseG.add(plate);
  const floor = new THREE.Mesh(new THREE.BoxGeometry(CFG.CHIM_W - 0.14, 0.05, CFG.CHIM_D - 0.14), matDark);
  floor.position.set(CFG.CHIM_X, CFG.BASE_H + 0.05, 0);
  caseG.add(floor);
}
{ // chimney with perforated windshield plates (real holes via extruded shapes)
  const W = CFG.CHIM_W, H = CFG.CHIM_H, TH = 0.06;
  function perforatedPlate(w, holes) {
    const s = new THREE.Shape();
    const r = 0.1, hw = w / 2, hh = H / 2;
    s.moveTo(-hw + r, -hh); s.lineTo(hw - r, -hh); s.quadraticCurveTo(hw, -hh, hw, -hh + r);
    s.lineTo(hw, hh - r); s.quadraticCurveTo(hw, hh, hw - r, hh);
    s.lineTo(-hw + r, hh); s.quadraticCurveTo(-hw, hh, -hw, hh - r);
    s.lineTo(-hw, -hh + r); s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
    for (const [x, y, hr] of holes) {
      const p = new THREE.Path(); p.absarc(x, y, hr, 0, Math.PI * 2, true); s.holes.push(p);
    }
    const g = new THREE.ExtrudeGeometry(s, { depth: TH, bevelEnabled: false, curveSegments: 10 });
    g.translate(0, 0, -TH / 2);
    return g;
  }
  // classic Zippo windscreen: two aligned rows of four holes per broad face,
  // the rows continuing as one column of two on each narrow end
  const broadHoles = [];
  for (let i = 0; i < 4; i++) broadHoles.push([-0.75 + i * 0.5, 0.23, 0.1], [-0.75 + i * 0.5, -0.23, 0.1]);
  const pg = perforatedPlate(W, broadHoles);
  const front = new THREE.Mesh(pg, matChromeDark);
  front.position.set(CFG.CHIM_X, CFG.BASE_H + H / 2, CFG.CHIM_D / 2 - TH / 2);
  const back = new THREE.Mesh(pg, matChromeDark);
  back.position.set(CFG.CHIM_X, CFG.BASE_H + H / 2, -CFG.CHIM_D / 2 + TH / 2);
  caseG.add(front, back);
  const eg = perforatedPlate(CFG.CHIM_D - TH * 2, [[0, 0.23, 0.1], [0, -0.23, 0.1]]);
  eg.rotateY(Math.PI / 2);
  for (const sx of [-1, 1]) {
    const side = new THREE.Mesh(eg, matChromeDark);
    side.position.set(CFG.CHIM_X + sx * (W / 2 - TH / 2), CFG.BASE_H + H / 2, 0);
    caseG.add(side);
  }
}
const wheelSpin = new THREE.Mesh(
  new THREE.CylinderGeometry(CFG.WHEEL_R, CFG.WHEEL_R, CFG.WHEEL_T, 30), matSteel);
{ // flint wheel: axis along z, knurled rim
  const wg = new THREE.Group();
  wg.position.set(CFG.WHEEL_X, CFG.WHEEL_Y, 0);
  wg.rotation.x = Math.PI / 2;             // cylinder axis -> world z
  wg.add(wheelSpin);
  caseG.add(wg);
  const bg = new THREE.BoxGeometry(0.56, 0.6, 0.06);
  for (const sz of [-1, 1]) {
    const b = new THREE.Mesh(bg, matChromeDark);
    b.position.set(CFG.WHEEL_X, CFG.WHEEL_Y - 0.12, sz * (CFG.WHEEL_T / 2 + 0.055));
    caseG.add(b);
  }
  const collar = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, 0.14, 12), matChromeDark);
  collar.position.set(CFG.WHEEL_X, CFG.BASE_H + 0.04, 0);
  caseG.add(collar);
}

// --- bendable wick: 4-segment plastic chain (wire core -> holds its shape) ---
const wick = { joints: [], tipObj: null, base: null, straightening: false };
{
  const L = CFG.WICK_SEG_LEN;
  wick.base = new THREE.Group();
  wick.base.position.set(CFG.CHIM_X, CFG.BASE_H + 0.06, 0);
  caseG.add(wick.base);
  let parent = wick.base;
  for (let i = 0; i < CFG.WICK_SEGS; i++) {
    const j = new THREE.Group();
    j.position.y = i === 0 ? 0 : L;
    const seg = new THREE.Mesh(
      new THREE.CylinderGeometry(CFG.WICK_R * (1 - i * 0.045), CFG.WICK_R * (1 - (i - 1) * 0.045), L, 8),
      i === CFG.WICK_SEGS - 1 ? matWickTip : matWick);
    seg.position.y = L / 2;
    const knee = new THREE.Mesh(new THREE.SphereGeometry(CFG.WICK_R * (1 - i * 0.045), 8, 6),
      i >= CFG.WICK_SEGS - 1 ? matWickTip : matWick);
    j.add(seg, knee);
    parent.add(j);

      ? twoMode.ids.includes(e.pointerId)
      : (e.pointerId === twoMode.lidId || e.pointerId === twoMode.baseId);

      && Math.hypot(tr.x - lastTap.x, tr.y - lastTap.y) < CFG.DBL_PX * uiScale()) {

window.addEventListener('blur', resetPointers);
const wickPlane = new THREE.Plane();
function dragWick(px, py) {

  wick.base.getWorldPosition(_v2);
  wickPlane.setFromNormalAndCoplanarPoint(_v1, _v2);

  const local = caseG.worldToLocal(_v4.clone());
  local.y = clamp(local.y, CFG.BASE_H + 0.22, RIM_Y + 1.5);
  if (local.y < RIM_Y) {
    local.x = clamp(local.x, CFG.CHIM_X - CFG.CHIM_W / 2 + 0.15, CFG.CHIM_X + CFG.CHIM_W / 2 - 0.15);
    local.z = clamp(local.z, -CFG.CHIM_D / 2 + 0.14, CFG.CHIM_D / 2 - 0.14);

    local.x = clamp(local.x, CFG.CHIM_X - 1.7, CFG.CHIM_X + 1.7);

  if (local.y > RIM_Y + 0.45) {
    for (const j of wick.joints) j.quaternion.slerp(_qI.identity(), 0.09);

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
canvas.addEventListener('pointerup', onPointerUp);
canvas.addEventListener('pointercancel', onPointerCancel);
canvas.addEventListener('lostpointercapture', () => {});
for (const ev of ['contextmenu', 'dblclick', 'gesturestart', 'gesturechange']) {
  window.addEventListener(ev, e => e.preventDefault(), { passive: false });
}
window.addEventListener('wheel', e => {
  e.preventDefault();
  cam.zoom = clamp(cam.zoom * (1 + Math.sign(e.deltaY) * 0.08), CFG.ZOOM_MIN, CFG.ZOOM_MAX);
}, { passive: false });
// keyboard fallback (desktop)
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  if (Audio.ensure()) Audio.resume();
  switch (e.key) {
    case ' ': Actions.flipLid(!lidIsOpen()); break;
    case 's': case 'S': Actions.strike(3); break;
    case 'b': case 'B': if (lidIsOpen()) setWickBend(1); break;
    case 'u': case 'U': wick.straightening = true; break;
    case 'j': case 'J': Actions.jerk(); break;
    case 'k': case 'K': Actions.shake(); break;
  }
});

/* ============================== DEVICE MOTION ============================== */
const Motion = {
  hasOrient: false, beta: 0, gamma: 0,
  emaAcc: 0, shakeT: 0, lastJerk: -9, lastEvT: 0,
  lpG: new THREE.Vector3(),
  accWorld: new THREE.Vector3(),
};
function screenAngle() {
  if (screen.orientation && typeof screen.orientation.angle === 'number') return screen.orientation.angle;
  return (typeof window.orientation === 'number') ? window.orientation : 0;
}
function deviceToWorld(dx, dy, dz, out) {
  const a = THREE.MathUtils.degToRad(screenAngle());
  const sx = dx * Math.cos(a) - dy * Math.sin(a);
  const sy = dx * Math.sin(a) + dy * Math.cos(a);
  return out.set(0, 0, 0)
    .addScaledVector(cam.right, sx)
    .addScaledVector(cam.up, sy)
    .addScaledVector(cam.back, dz * 0.6);
}
function onOrient(e) {
  if (e.beta === null || e.gamma === null) return;
  Motion.hasOrient = true;
  Motion.beta = e.beta;
  Motion.gamma = e.gamma;
}
function onMotion(e) {
  Motion.sawMotion = true;
  const now = performance.now();
  const dtE = clamp((now - (Motion.lastEvT || now)) / 1000, 0.008, 0.1);
  Motion.lastEvT = now;
  let ax = 0, ay = 0, az = 0;
  const acc = e.acceleration;
  if (acc && (acc.x !== null) && (Math.abs(acc.x) + Math.abs(acc.y) + Math.abs(acc.z) > 0.001 || Motion.hadPureAcc)) {
    Motion.hadPureAcc = true;
    ax = acc.x || 0; ay = acc.y || 0; az = acc.z || 0;
  } else if (e.accelerationIncludingGravity && e.accelerationIncludingGravity.x !== null) {
    const ig = e.accelerationIncludingGravity;
    Motion.lpG.lerp(_v1.set(ig.x || 0, ig.y || 0, ig.z || 0), clamp01(dtE * 2));
    ax = (ig.x || 0) - Motion.lpG.x; ay = (ig.y || 0) - Motion.lpG.y; az = (ig.z || 0) - Motion.lpG.z;
  }
  const mag = Math.hypot(ax, ay, az);
  const tS = now / 1000;

  if (mag > CFG.JERK_ACC && (tS - Motion.lastJerk) > 0.6 && Motion.emaAcc < 6) {
    Motion.lastJerk = tS;
    deviceToWorld(ax, ay, az, Motion.accWorld);
    Actions.jerk(Motion.accWorld.normalize());
  }
  Motion.emaAcc += (mag - Motion.emaAcc) * clamp01(dtE * 2.5);

  if (Motion.emaAcc > CFG.SHAKE_EMA) {

    if (Motion.shakeT > CFG.SHAKE_HOLD) { Motion.shakeT = -1.4; Actions.shake(); }

}
const needsMotionPermission =
  typeof DeviceMotionEvent !== 'undefined' &&
  typeof DeviceMotionEvent.requestPermission === 'function';
if (needsMotionPermission) {
  motionBtn.classList.add('show');
  motionBtn.addEventListener('click', async () => {
    motionBtn.classList.remove('show');
    try {
      const r = await DeviceMotionEvent.requestPermission();
      if (typeof DeviceOrientationEvent !== 'undefined' &&
        typeof DeviceOrientationEvent.requestPermission === 'function') {
        try { await DeviceOrientationEvent.requestPermission(); } catch (e) { /* one prompt usually covers both */ }

}
function updateGravity(dt) {

    const gz = -Math.cos(b) * Math.cos(g);
    deviceToWorld(gx, gy, gz, _v1);
    if (_v1.lengthSq() > 0.05) {
      sim.gWorld.lerp(_v1.normalize(), 1 - Math.exp(-7 * dt)).normalize();
    }

    sim.gWorld.lerp(_v1.set(0, -1, 0), 1 - Math.exp(-4 * dt)).normalize();
  }

/* ============================== HINTS ============================== */
// works with denied/absent motion sensors too: the flick fallback gets hinted instead
function relightHint() {
  return (Motion.hasOrient || Motion.sawMotion)
    ? 'the flame is hiding — snap the phone!'
    : 'the flame is hiding — flick across the screen!';
}
const HINTS = [
  { id: 'open', text: () => 'flip the lid • flick down the wheel', done: () => sim.disc.lit },
  { id: 'squeeze', text: () => 'try the squeeze: pinch lid-top + base-bottom', done: () => sim.disc.pop },
  { id: 'smother', text: () => 'swipe slowly across the flame to snuff it', done: () => sim.disc.smother },
  { id: 'ember', text: () => 'bend the wick low, then swipe the flame away…', done: () => sim.disc.ember },
  { id: 'relight', text: relightHint, done: () => sim.disc.relight },

function currentHints() {
  // the relight hint only makes sense while an ember is actually hiding

}
function updateHints() {
  const hs = currentHints();
  if (sim.flame.state === EMBER && !sim.disc.relight) {
    hintEl.textContent = relightHint();
    hintEl.classList.add('show');
    return;

  if (!hs.length) { hintEl.classList.remove('show'); return; }
  hintEl.textContent = hs[hintIdx % hs.length].text();

/* ============================== RESIZE / VISIBILITY / LOOP ============================== */
function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.MAX_DPR));
  renderer.setSize(w, h);
  composer.setPixelRatio(Math.min(window.devicePixelRatio || 1, CFG.MAX_DPR));
  composer.setSize(w, h);

window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 60));

let running = true, rafId = 0, lastT = 0, acc = 0;

  if (!running) return;
  rafId = requestAnimationFrame(loop);
  if (!lastT) lastT = tms;

  lastT = tms;
  const dt = clamp(dtRaw, 0, 0.05);
  if (dtRaw > 0) fpsEma = lerp(fpsEma, 1 / Math.max(1e-3, dtRaw), 0.04);

  if (bloomOn && warm > 5 && fpsEma < CFG.FPS_BLOOM_OFF) bloomOn = false;

  while (acc >= CFG.H) { stepPhysics(CFG.H); acc -= CFG.H; }

  if (document.hidden) {
    running = false;
    cancelAnimationFrame(rafId);
    Audio.suspend();
    resetPointers();
  } else {
    running = true;
    lastT = 0;
    rafId = requestAnimationFrame(loop);
    Audio.resume();
    if (sim.flame.state !== OUT) requestWake();
  }

/* ============================== DEBUG / TEST API ============================== */
window.LIGHTER = {
  CFG, sim, Actions, cam, renderer, scene,

  get state() { return sim.flame.state; },
  get lidTheta() { return sim.lid.theta; },
  get frames() { return frames; },
  get fps() { return fpsEma; },
  get bloomOn() { return bloomOn; },
