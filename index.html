<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Lighter</title>
<meta name="description" content="A pocket flip-lighter you can play with. Flick it open, spin the wheel.">
<meta name="theme-color" content="#050608">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lighter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="scene" id="scene">
  <div class="glow"></div>
  <div class="floor-shadow"></div>
  <div class="lighter" id="lighter">
    <div class="case">
      <div class="engrave"></div>
      <div class="case-rim"></div>
    </div>
    <div class="insert">
      <div class="chimney"><div class="wick" id="wick"></div></div>
      <div class="wheel" id="wheel"></div>
    </div>
    <div class="lid" id="lid"><div class="engrave"></div></div>
    <div class="hinge"></div>
  </div>
  <div class="hint" id="hint">flick up to open</div>
</div>
<canvas id="fx"></canvas>
<script src="app.js"></script>
</body>
</html>
